<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>昔涟 · 状态</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
</head>
<body>
  <div class="sidebar">
    <!-- ===== 顶栏（拖拽区） ===== -->
    <header class="titlebar">
      <button type="button" class="icon-btn" id="pin-btn" aria-label="置顶" title="置顶">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 17v5"/>
          <path d="M9 10.76V6a3 3 0 0 1 6 0v4.76a2 2 0 0 0 .59 1.41L18 14H6l2.41-1.83A2 2 0 0 0 9 10.76Z"/>
        </svg>
      </button>
      <div class="titlebar__title">
        <span class="titlebar__name">昔涟</span>
        <span class="titlebar__hint">状态面板</span>
      </div>
      <div class="titlebar__actions">
        <button type="button" class="win-btn" id="min-btn" aria-label="最小化" title="最小化">
          <svg width="9" height="2" viewBox="0 0 9 2" aria-hidden="true">
            <rect width="9" height="2" rx="1" fill="currentColor"/>
          </svg>
        </button>
        <button type="button" class="win-btn win-btn--close" id="close-btn" aria-label="关闭" title="关闭">
          <svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true">
            <line x1="2" y1="2" x2="7" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="7" y1="2" x2="2" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ===== 主体内容 ===== -->
    <main class="body">
      <!-- 头像区 -->
      <section class="profile">
        <img class="profile__avatar" src="../static/assets/avatar.png" alt="昔涟" draggable="false" />
        <div class="profile__name">昔涟</div>
        <div class="profile__online" id="online-badge">
          <span class="profile__dot" aria-hidden="true"></span>
          <span id="online-status-label">在线</span>
        </div>
      </section>

      <hr class="divider" />

      <!-- 状态卡 -->
      <section class="card card--status">
        <div class="indicator">
          <div class="indicator__emoji" id="status-emoji">🌸</div>
          <div class="indicator__text">
            <span class="indicator__prefix">状态：</span>
            <span class="indicator__label" id="status-label">陪伴中</span>
          </div>
        </div>
      </section>

      <!-- 心情卡 -->
      <section class="card card--feeling">
        <div class="indicator">
          <div class="indicator__emoji" id="feeling-emoji">🌿</div>
          <div class="indicator__text">
            <span class="indicator__prefix">心情：</span>
            <span class="indicator__label" id="feeling-label">平静</span>
          </div>
        </div>
      </section>

      <!-- 喂养卡 -->
      <section class="card feed-card">
        <div class="feed-row">
          <span class="feed-row__emoji" aria-hidden="true">🍰</span>
          <span>当前模型：</span>
          <span class="feed-row__name" id="feeding-model">获取中…</span>
        </div>
        <button type="button" class="action-btn" id="open-chat-btn" title="打开聊天">
          <span class="action-btn__icon" aria-hidden="true">💬</span>
          <span>打开聊天</span>
        </button>
        <button type="button" class="action-btn" id="model-switch-btn" title="切换模型">
          <span class="action-btn__icon" aria-hidden="true">⇄</span>
          <span>切换模型</span>
        </button>
        <!-- 模型选择浮层 -->
        <div class="provider-picker" id="provider-picker" hidden>
          <div class="provider-picker__list" id="provider-list"></div>
        </div>
      </section>

      <!-- 设置卡 -->
      <section class="card" style="padding: 10px;">
        <button type="button" class="action-btn action-btn--settings" id="settings-btn" title="打开设置">
          <span class="action-btn__icon" aria-hidden="true">⚙</span>
          <span>设置</span>
        </button>
      </section>

      <hr class="divider" />

      <div class="version">昔涟 v0.0.1</div>
      <div class="token-line">
        <span>Token：</span>
        <span class="token-line__value" id="token-usage">获取中…</span>
      </div>
    </main>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/sidebar.js"></script>
</body>
</html>
