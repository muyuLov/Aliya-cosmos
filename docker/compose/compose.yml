name: aliya-cosmos

services:
  neo4j:
    image: neo4j:latest
    container_name: aliya-cosmos-neo4j
    volumes:
      - ../data/Neo4j/logs:/logs
      - ../data/Neo4j/data:/data
      - ../data/Neo4j/plugins:/plugins
      - ../data/Neo4j/config:/config
    environment:
        - NEO4J_AUTH=neo4j/Aliya_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always

  astratts:
    build:
      context: ../data/AstraTTS
      dockerfile: Dockerfile
    image: astratts-server:latest
    container_name: aliya-cosmos-astratts
    ports:
      - "5000:5000"
    volumes:
      - ../data/AstraTTS/resources:/app/resources
      - type: bind
        source: ../data/AstraTTS/config.yaml
        target: /app/config.yaml
    restart: unless-stopped

  # ── 向量数据库：Milvus（standalone，语义检索）─────────────
  # Milvus standalone 依赖 etcd（元数据）+ MinIO（对象存储）。
  etcd:
    image: quay.io/coreos/etcd:v3.7.1
    container_name: aliya-cosmos-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ../data/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: always

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aliya-cosmos-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ../data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: always

  milvus:
    image: milvusdb/milvus:v2.6.22
    container_name: aliya-cosmos-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ../data/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always
