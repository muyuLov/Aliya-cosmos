# ── 全局配置 ──────────────────────────────────────────────
cosmos:
  # ── 角色配置 ──────────────────────────────────────────
  characters:
    ai_name: Aliya                     # AI 角色名称（用于记忆格式化等）
    user_name: cosmos                  # 用户名称（用于记忆格式化等）

  # ── 日志系统 ──────────────────────────────────────────
  logger:
    debug: true                        # 全局调试模式
    level: debug                       # 日志级别: debug/info/warning/error
    structured: false                  # 是否启用 JSON 结构化日志
    console:
      color: true                      # 控制台彩色输出
      enabled: true                    # 启用控制台日志
    file:
      enabled: true                    # 启用文件日志
      path: data/logs/cosmos.log       # 日志文件路径
      max_bytes: 10485760              # 单文件最大字节数（10MB）
      backup_count: 30                 # 保留备份文件数
      buffer_size: 100                 # 缓冲行数
      flush_interval: 5.0              # 刷新间隔（秒）
      max_queue_size: 10000            # 异步队列最大长度
      rotate: session                  # 轮转策略: session/timed/sized
      when: midnight                   # 按日轮转触发时间

  # ── 服务配置 ──────────────────────────────────────────
  service:
    # ── Agent WebSocket 服务 ──────────────────────────
    agent:
      ws_server:
        host: ${WS_HOST:127.0.0.1}      # 监听地址（容器内设为 0.0.0.0 以对外暴露端口）
        port: ${WS_PORT:8765}           # 监听端口
      # ── Agent 权限配置 ──────────────────────────────────
      permissions:
        config_path: data/config/Permissions.yml  # 权限配置文件
      # max_soul_retries: 2         # 净化失败重试次数（调用超时不重试）
      # ── 情感系统配置（SDK EmotionPersonality，可选） ──────────────────
      emotion:
        classifier: auto              # 情绪分类方式: rule（不创建向量分类器）/ vector / auto（auto 在向量可用时语义分类）
        # max_samples_per_emotion: 30  # 每类情绪最多向量化入库的样本数（0=全量；调大提升近邻覆盖、调小缩短入库耗时）
        # 情绪人格参数（不设置则用 SDK 默认值）：
        # reactivity: 1.0              # 情绪响应性（0.2-2.5）
        # decayRate: 0.018             # 情绪衰减速率（0.002-0.4）
        # emotionHoldSeconds: 18.0     # 情绪保持时长（0-90 秒）
        # ambientDriftStrength: 0.034  # 环境漂移幅度（0-0.09，0 关闭）
        # emotionBias: {}              # 情绪偏置（按情绪名放大/缩小推入量）
      # ── 认知引擎配置（LAAP 认知架构：PSI 需求驱动 + 五层记忆 + 世界模型 + 自我模型） ──
      cognition:
        enabled: true                  # 认知引擎总开关
        maintenance_interval: 10       # 自主维护触发间隔（交互次数）
    # ── GRAG 图记忆系统 ────────────────────────────────
    grag:
      enabled: true                    # 启用记忆系统
      auto_extract: true               # 自动提取五元组
      context_length: 10               # 上下文窗口长度
      similarity_threshold: 0.7        # 语义相似度阈值（0-1）
      session_tracking: true            # 启用会话追踪
      neo4j:
        uri: bolt://${NEO4J_HOST:127.0.0.1}:${NEO4J_PORT:7687}   # Neo4j 连接地址（容器内环境覆盖为服务名）
        user: neo4j                     # 用户名
        password: ${NEO4J_PASSWORD:Aliya_neo4j}  # 密码（支持环境变量覆盖，默认 Aliya_neo4j）
        database: neo4j                 # 数据库名
      extractor:
        max_retries: 2                 # 五元组提取最大重试次数
        timeout: 30                    # 提取超时（秒）
      task_manager:
        max_workers: 3                 # 并发工作协程数
        max_queue_size: 100            # 任务队列最大长度
        task_timeout: 30               # 单任务超时（秒）
        auto_cleanup_hours: 24         # 已完成任务保留时间（小时）
        cleanup_interval_seconds: 3600 # 自动清理循环运行间隔（秒）

    # ── 向量模块 ──────────────────────────────────────────
    vector:
      enabled: true                    # 启用向量模块
      storage: milvus                  # 存储后端: memory（进程内存，重启即清空）/ milvus（Milvus 向量库持久化）
      milvus_uri: http://127.0.0.1:19530  # Milvus 服务地址（docker/compose.yml 部署，standalone 默认端口 19530）
      milvus_collection: aliya_memory  # Milvus 集合名（向量记忆持久化容器，自动创建）
      similarity_threshold: 0.5        # 检索相似度阈值（0-1）
      top_k: 5                         # 默认检索返回条数
      embedding:
        model: "text-embedding-qwen3-embedding-8b"   # 必须配置 embedding 模型名（如 text-embedding-3-small）
        url: "http://127.0.0.1:1234"   # 必须配置服务地址
        api_key: ""                    # API 密钥（本地服务如 Ollama/LM Studio 可留空）
        batch_size: 128                # 批量向量化文本条数（上限 128；调大可减少 API 往返，缩短语料批量入库耗时）
        concurrency: 4                 # 单次向量化并发批次上限（上限 32；本地服务推理串行，过大只会排队）
        dimension: 4096                # 期望向量维度（0=由 API 返回自动推断；非 0 时校验一致性）
        
    # ── LLM 大语言模型 ────────────────────────────────
    llm:
      # 支持 ${ENV_VAR} 和 ${ENV_VAR:default} 语法引用环境变量
      providers:
        name: deepseek                 # 当前使用的提供商名
        config_path: data/config/LLMProviders.json  # 提供商配置文件
      history_max_chars: 90000         # 消息历史字符数阈值，超限时移除最旧消息
      cot_enabled: true                # 思维链（CoT）模式: true=启用, false=禁用
      reasoning_effort: high           # 思考强度（DeepSeek 专有）: high / max / low

    # ── 表达风格 ──────────────────────────────────
    prompt:
      style: default                   # 默认表达风格: default / lively / healing / sweet
      auto_style: true           # 自动风格切换（纯 LLM 模式）

    # ── TTS 语音合成 ──────────────────────────────────
    tts:
      providers:
        name: astra                    # 当前使用的提供商名
        config_path: data/config/TTSProviders.json   # 提供商配置文件（支持 ${ENV_VAR} 语法）
      voice:
        languages: [zh, en]            # 支持的语言列表
        speed: 1.0                     # 语速倍率（0.5-2.0）
      service:
        prefetch_queue_size: 16        # 预取队列大小（分段数）
        prefetch_window: 3             # 滑动窗口预取段数，减少资源浪费
        max_concurrent_creates: 10     # 最大并发创建会话数
      player:
        sample_rate: 32000             # 采样率（Hz）
        channels: 1                    # 声道数（1=单声道）
        pcm_format: float32            # PCM 格式
        frames_per_buffer: 1024        # 缓冲区帧数
        play_queue_size: 32            # 播放队列大小（段数）
        queue_timeout: 300.0           # 播放队列超时（秒）