# ── 全局配置 ──────────────────────────────────────────────
cosmos:
  # ── 角色配置 ──────────────────────────────────────────
  characters:
    ai_name: Aliya                     # AI 角色名称（用于记忆格式化等）
    user_name: cosmos                  # 用户名称（用于记忆格式化等）

  # ── 日志系统 ──────────────────────────────────────────
  logger:
    debug: true                        # 全局调试模式
    level: debug                       # 日志级别: debug/info/warning/error
    structured: false                  # 是否启用 JSON 结构化日志
    console:
      color: true                      # 控制台彩色输出
      enabled: true                    # 启用控制台日志
    file:
      enabled: true                    # 启用文件日志
      path: data/logs/cosmos.log       # 日志文件路径
      max_bytes: 10485760              # 单文件最大字节数（10MB）
      backup_count: 30                 # 保留备份文件数
      buffer_size: 100                 # 缓冲行数
      flush_interval: 5.0              # 刷新间隔（秒）
      max_queue_size: 10000            # 异步队列最大长度
      rotate: session                  # 轮转策略: session/timed/sized
      when: midnight                   # 按日轮转触发时间

  # ── 服务配置 ──────────────────────────────────────────
  service:
    # ── Agent WebSocket 服务 ──────────────────────────
    agent:
      ws_server:
        host: ${WS_HOST:127.0.0.1}      # 监听地址（容器内设为 0.0.0.0 以对外暴露端口）
        port: ${WS_PORT:8765}           # 监听端口
      # ── Agent 权限配置 ──────────────────────────────────
      permissions:
        config_path: data/config/Permissions.yml  # 权限配置文件

      # ── 情绪引擎配置 ──────────────────────────────────
      emotion:
        enabled: true                       # 启用情绪引擎
        fallback: neutral                   # 无结果时的默认情绪
        fast_rise: ["sad", "anxiety", "anger", "disgusted"]  # 负面快速上升
        observer_weight: 0.3                # 常规观测权重
        fast_rise_weight: 0.62              # 快速上升权重
        scene_match_threshold: 0.72         # 场景匹配阈值

      # ── 主动聊天配置 ──────────────────────────────────
      proactive:
        enabled: false                      # 默认关闭，GUI 设置页可开
        check_interval_seconds: 60          # 调度轮询间隔
        quiet_hours:
          start: "23:00"                    # 不打搅开始
          end: "07:00"                      # 不打搅结束
        idle_timeout_minutes: 30            # 用户无操作静默超时
        triggers:
          - type: schedule                  # 定时触发
            at: "20:00"
            message: "晚上好呀，今天过得怎么样？"
          - type: idle                      # 静默超时触发
            message: "看你半天没说话，是在忙吗？"

      # ── 知识库配置（M3 RAG）──────────────────────────────
      knowledge:
        dir: data/knowledge                # 启动索引目录（存放 .md 文档，RAG 检索来源）

      # ── MCP 服务器配置（M3）─────────────────────────────
      mcp:
        config_path: data/config/MCPServers.json  # MCP 服务器列表文件（JSON 数组，每项含 name/transport/command/url/enabled）

      # ── 渠道配置（多渠道接入）─────────────────────────
      channels:
        feishu:
          enabled: false              # 默认关闭，显式开启
          app_id: ""                  # 飞书应用 app_id
          app_secret: ""              # 飞书应用 app_secret（不落盘明文密钥文件）
          verification_token: ""      # 事件订阅校验 token
          event_path: "/channels/feishu"   # 接收 webhook 的路由路径
          confirm_via_feishu: true    # 高风险工具是否经飞书交互确认
        wechat:
          enabled: false
          corp_id: ""                 # 企业微信 corp_id（或本地桥接标识）
          agent_id: ""
          secret: ""                  # 应用 secret
          token: ""                   # 回调校验 token
          aes_key: ""                 # 消息加密 aes_key
          event_path: "/channels/wechat"
          confirm_via_wechat: true
    # ── GRAG 图记忆系统 ────────────────────────────────
    grag:
      enabled: true                    # 启用记忆系统
      auto_extract: true               # 自动提取五元组
      context_length: 10               # 上下文窗口长度
      similarity_threshold: 0.7        # 语义相似度阈值（0-1）
      session_tracking: true            # 启用会话追踪
      neo4j:
        uri: bolt://${NEO4J_HOST:127.0.0.1}:${NEO4J_PORT:7687}   # Neo4j 连接地址（容器内环境覆盖为服务名）
        user: neo4j                     # 用户名
        password: ${NEO4J_PASSWORD:Aliya_neo4j}  # 密码（支持环境变量覆盖，默认 Aliya_neo4j）
        database: neo4j                 # 数据库名
      extractor:
        max_retries: 2                 # 五元组提取最大重试次数
        timeout: 30                    # 提取超时（秒）
      task_manager:
        max_workers: 3                 # 并发工作协程数
        max_queue_size: 100            # 任务队列最大长度
        task_timeout: 30               # 单任务超时（秒）
        auto_cleanup_hours: 24         # 已完成任务保留时间（小时）
        cleanup_interval_seconds: 3600 # 自动清理循环运行间隔（秒）

    # ── 向量模块 ──────────────────────────────────────────
    vector:
      enabled: true                    # 启用向量模块
      similarity_threshold: 0.5        # 检索相似度阈值（0-1）
      top_k: 5                         # 默认检索返回条数
      embedding:
        model: "text-embedding-qwen3-embedding-8b"   # 必须配置 embedding 模型名（如 text-embedding-3-small）
        url: "http://127.0.0.1:1234"   # 必须配置服务地址
        api_key: ""                    # API 密钥（本地服务如 Ollama/LM Studio 可留空）
        batch_size: 128                # 批量向量化文本条数（上限 128；调大可减少 API 往返，缩短语料批量入库耗时）
        concurrency: 4                 # 单次向量化并发批次上限（上限 32；本地服务推理串行，过大只会排队）
        dimension: 4096                # 期望向量维度（0=由 API 返回自动推断；非 0 时校验一致性）
        
    # ── LLM 大语言模型 ────────────────────────────────
    llm:
      # 支持 ${ENV_VAR} 和 ${ENV_VAR:default} 语法引用环境变量
      providers:
        name: deepseek                 # 当前使用的提供商名
        config_path: data/config/LLMProviders.json  # 提供商配置文件
      history_max_chars: 90000         # 消息历史字符数阈值，超限时移除最旧消息
      cot_enabled: true                # 思维链（CoT）模式: true=启用, false=禁用
      reasoning_effort: high           # 思考强度: high / max / low
