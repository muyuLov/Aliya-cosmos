# ── 全局配置 ──────────────────────────────────────────────
cosmos:
  # ── 角色配置 ──────────────────────────────────────────
  characters:
    ai_name: Aliya                     # AI 角色名称（用于记忆格式化等）
    user_name: cosmos                  # 用户名称（用于记忆格式化等）

  # ── 日志系统 ──────────────────────────────────────────
  logger:
    debug: true                        # 全局调试模式
    level: debug                       # 日志级别: debug/info/warning/error
    structured: false                  # 是否启用 JSON 结构化日志
    layered:
      enabled: true                    # 启用分层日志
      colors: true                     # 启用颜色
      color_theme: dark                # dark | light
      kaomoji: true                    # 颜文字模式（false=符号模式）
      density: standard                # summary | standard | diagnostic
    blind_mode:
      enabled: false                   # 失明模式
      health_report_minutes: 10        # 健康报告间隔（钳制 1-1440）
    console:
      color: true                      # 控制台彩色输出
      enabled: true                    # 启用控制台日志
    file:
      enabled: true                    # 启用文件日志
      path: data/logs/cosmos.log       # 日志文件路径
      max_bytes: 10485760              # 单文件最大字节数（10MB）
      backup_count: 30                 # 保留备份文件数
      buffer_size: 100                 # 缓冲行数
      flush_interval: 5.0              # 刷新间隔（秒）
      max_queue_size: 10000            # 异步队列最大长度
      rotate: session                  # 轮转策略: session/timed/sized
      when: midnight                   # 按日轮转触发时间

  # ── 服务配置 ──────────────────────────────────────────
  service:
    # ── Agent WebSocket 服务 ──────────────────────────
    agent:
      ws_server:
        host: ${WS_HOST:127.0.0.1}      # 监听地址（容器内设为 0.0.0.0 以对外暴露端口）
        port: ${WS_PORT:8765}           # 监听端口
      # ── Agent 权限配置 ──────────────────────────────────
      permissions:
        config_path: data/config/Permissions.yml  # 权限配置文件

      # ── Alter 氛围配置 ──────────────────────────────────
      alter:
        enabled: true
        base_threshold: 5.0             # 基础触发阈值
        density_factor: 0.5             # 对话密度影响因子
        cooldown_seconds: 300           # 冷却时间（秒）

      # ── Agency 容量配置 ──────────────────────────────────
      agency:
        enabled: true
        max_window_minutes: 240         # 行动窗口上限
        min_proactive_interval_minutes: 60

      # ── 休息窗口配置 ──────────────────────────────────────
      rest_windows:
        - enabled: true
          label: "夜间休息"
          start_hour: 22
          start_minute: 0
          end_hour: 8
          end_minute: 0
          min_interval_minutes: 120
          max_interval_minutes: 240

      # ── 调度器配置 ──────────────────────────────────────────
      scheduler:
        sweep_interval_minutes: 5
        advance_interval_minutes: 10
        advance_jitter_minutes: 2
        background_interval_minutes: 10

      # ── 主叙事器配置 ──────────────────────────────────────────
      narrator:
        max_script_characters: 8000
        max_retries: 3
        timeout: 30.0
        max_context_characters: 20000

      # ── 知识库配置（M3 RAG）──────────────────────────────
      knowledge:
        dir: data/knowledge                # 启动索引目录（存放 .md 文档，RAG 检索来源）

      # ── MCP 服务器配置（M3）─────────────────────────────
      mcp:
        config_path: data/config/MCPServers.json  # MCP 服务器列表文件（JSON 数组，每项含 name/transport/command/url/enabled）

      # ── 渠道配置（多渠道接入）─────────────────────────
      channels:
        feishu:
          enabled: false              # 默认关闭，显式开启
          app_id: ""                  # 飞书应用 app_id
          app_secret: ""              # 飞书应用 app_secret（不落盘明文密钥文件）
          verification_token: ""      # 事件订阅校验 token
          event_path: "/channels/feishu"   # 接收 webhook 的路由路径
          confirm_via_feishu: true    # 高风险工具是否经飞书交互确认
        wechat:
          enabled: false
          corp_id: ""                 # 企业微信 corp_id（或本地桥接标识）
          agent_id: ""
          secret: ""                  # 应用 secret
          token: ""                   # 回调校验 token
          aes_key: ""                 # 消息加密 aes_key
          event_path: "/channels/wechat"
          confirm_via_wechat: true
    # ── 分层记忆配置 ────────────────────────────────────
    memory:
      layers:
        overlay:
          confidence_threshold: 0.82
          major_confidence_threshold: 0.95
          min_turns: 3
          min_days: 2
          cooldown_hours: 72
        fact:
          max_facts: 200
          importance_weight: 0.5
          confidence_weight: 0.35
          recency_weight: 0.15
      storage:
        backend: "sqlite_vec"
        sqlite_path: data/memory/memory.db
        dimension: 4096
      scenes:
        entry_threshold: 16
        char_threshold: 10000
        silence_minutes: 30
        hook_chars: 2000
        summary_chars: 8000

    # ── 向量模块 ──────────────────────────────────────────
    vector:
      enabled: true                    # 启用向量模块
      similarity_threshold: 0.5        # 检索相似度阈值（0-1）
      top_k: 5                         # 默认检索返回条数
      embedding:
        model: "text-embedding-qwen3-embedding-8b"   # 必须配置 embedding 模型名（如 text-embedding-3-small）
        url: "http://127.0.0.1:1234"   # 必须配置服务地址
        api_key: ""                    # API 密钥（本地服务如 Ollama/LM Studio 可留空）
        batch_size: 128                # 批量向量化文本条数（上限 128；调大可减少 API 往返，缩短语料批量入库耗时）
        concurrency: 4                 # 单次向量化并发批次上限（上限 32；本地服务推理串行，过大只会排队）
        dimension: 4096                # 期望向量维度（0=由 API 返回自动推断；非 0 时校验一致性）
        
    # ── LLM 大语言模型 ────────────────────────────────
    llm:
      # 支持 ${ENV_VAR} 和 ${ENV_VAR:default} 语法引用环境变量
      providers:
        name: deepseek                 # 当前使用的提供商名
        config_path: data/config/LLMProviders.json  # 提供商配置文件
      history_max_chars: 90000         # 消息历史字符数阈值，超限时移除最旧消息
      cot_enabled: true                # 思维链（CoT）模式: true=启用, false=禁用
      reasoning_effort: high           # 思考强度: high / max / low
