[project]
name = "Aliya-cosmos"
version = "0.1.0"
description = "《彼方的她-Aliya》"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    {name = "muyulov", email = "muyu_lov@yeah.net"}
]
keywords = ["llm", "chatbot", "ai", "conversation", "memory", "tts", "neo4j"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # 核心框架依赖
    "pyyaml>=6.0.3,<7.0.0",
    "pydantic>=2.13.0,<3.0.0",
    "urllib3>=2.6.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "requests>=2.33.0,<3.0.0",

    # LLM 核心依赖（必选）
    "openai>=2.36.0,<3.0.0",

    # 记忆系统依赖（必选）
    "py2neo>=2021.2.4,<2022.0.0",

    # TTS系统依赖（必选）
    "numpy>=2.4.0,<3.0.0",
    "sounddevice>=0.5.5,<1.0.0",
    "edge-tts>=7.2.8,<8.0.0",
    "imageio-ffmpeg>=0.6.0,<1.0.0",

    # Web服务依赖
    "fastapi>=0.136.0,<1.0.0",
    "uvicorn[standard]>=0.46.0,<1.0.0",
    "psutil>=7.2.0,<8.0.0",

    # GUI 桌面客户端依赖
    "pywebview>=5.0.0,<6.0.0",
    "pystray>=0.19.4,<1.0.0",
    "Pillow>=11.0.0,<12.0.0",
]

[project.urls]
Homepage = "https://github.com/muyulov/Aliya-cosmos"
Documentation = "https://github.com/muyulov/Aliya-cosmos/blob/main/README.md"
Repository = "https://github.com/muyulov/Aliya-cosmos"
Issues = "https://github.com/muyulov/Aliya-cosmos/issues"

[project.scripts]
aliya-gui = "GUI.main:main"

[project.optional-dependencies]
# 开发工具
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "black>=26.3.0,<28.0.0",
    "isort>=8.0.0,<9.0.0",
    "mypy>=2.0.0,<3.0.0",
    "pre-commit>=4.6.0,<5.0.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools]
packages = {find = {include = ["agent*", "core*", "memory*", "aliya_cosmos*", "GUI*"]}}

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.json", "*.md", "*.txt", "*.html", "*.css", "*.js", "*.png"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
