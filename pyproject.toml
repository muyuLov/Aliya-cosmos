[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Aliya-cosmos"
version = "0.1.0"
description = "《彼方的她-Aliya》"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [
    {name = "muyulov", email = "muyu_lov@yeah.net"}
]
keywords = [
    "ai", "chatbot", "llm", "conversation", "memory", 
    "neo4j", "knowledge-graph"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

dependencies = [
    # ========== 核心框架依赖 ==========
    "pydantic>=2.13.0,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    # ========== 网络和HTTP客户端 ==========
    "httpx>=0.28.0,<1.0.0",
    "requests>=2.33.0,<3.0.0",
    "urllib3>=2.6.0,<3.0.0",
    # ========== LLM 大语言模型 ==========
    "openai>=2.36.0,<3.0.0",
    # ========== 图数据库和记忆系统 ==========
    "py2neo>=2021.2.4,<2022.0.0",
    # ========== Web 服务框架 ==========
    "fastapi>=0.136.0,<1.0.0",
    "uvicorn[standard]>=0.46.0,<1.0.0",
    # ========== 系统监控工具 ==========
    "psutil>=7.2.0,<8.0.0",
    # ========== GUI 桌面客户端 ==========
    "pywebview>=5.0.0,<6.0.0",
    "pystray>=0.19.4,<1.0.0",
    "Pillow>=11.0.0,<12.0.0",
    "setuptools<81",
    "mcp>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/muyulov/Aliya-cosmos"
"Documentation" = "https://github.com/muyulov/Aliya-cosmos/blob/main/README.md"
"Repository" = "https://github.com/muyulov/Aliya-cosmos.git"
"Issues" = "https://github.com/muyulov/Aliya-cosmos/issues"
"Changelog" = "https://github.com/muyulov/Aliya-cosmos/blob/main/CHANGELOG.md"

[project.scripts]
aliya-gui = "GUI.main:main"
aliya-cosmos = "GUI.main:main"  # 别名

[project.optional-dependencies]
# ========== 代码质量工具 ==========
lint = [
    "black>=26.3.0,<28.0.0",
    "isort>=8.0.0,<9.0.0",
    "flake8>=7.1.0,<8.0.0",
    "mypy>=2.0.0,<3.0.0",
]

# ========== 测试框架 ==========
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
]

# ========== Git钩子和预提交 ==========
pre-commit = [
    "pre-commit>=4.6.0,<5.0.0",
]

# ========== 文档生成 ==========
docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings[python]>=0.26.0,<1.0.0",
]

# ========== 性能分析和调试 ==========
profile = [
    "py-spy>=0.3.14,<1.0.0",
    "memory-profiler>=0.60.0,<1.0.0",
    "line-profiler>=4.1.0,<5.0.0",
]

# ========== 完整开发环境 ==========
all = [
    "aliya-cosmos[dev,lint,pre-commit,docs,profile]",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

# ========== UV 包管理器配置 ==========
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# ========== setuptools 配置 ==========
[tool.setuptools]
packages = {find = {include = ["agent*", "core*", "aliya_cosmos*", "GUI*"]}}

[tool.setuptools.package-data]
"*" = [
    "*.yml", "*.yaml", "*.json", "*.md", "*.txt", 
    "*.html", "*.css", "*.js", "*.png", "*.ico", "*.svg"
]

# ========== Black 代码格式化 ==========
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    # 排除特定目录
    \.git
    | \.venv
    | \.pytest_cache
    | __pycache__
    | build
    | dist
)/
'''

# ========== isort 导入排序 ==========
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["agent", "core", "GUI", "aliya_cosmos"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ========== MyPy 类型检查 ==========
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
pretty = true

# 逐步启用严格检查的模块
[[tool.mypy.overrides]]
module = [
    "core.config.*",
    "core.logger.*",
    "agent.tools.*",
]
strict = true
disallow_untyped_defs = true

# ========== Flake8 风格检查 ==========
[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # Black会处理空格
    "E501",  # 行长度由Black处理
    "W503",  # 二元运算符前换行
    "F401",  # 导入但未使用（由isort处理）
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]
per-file-ignores = [
    "__init__.py:F401",
]

# ========== Pytest 测试配置 ==========
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: 慢速测试",
    "integration: 集成测试",
    "unit: 单元测试",
]

[dependency-groups]
dev = [
    "basedpyright>=1.1.0",
]
